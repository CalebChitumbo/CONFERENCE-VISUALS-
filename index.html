<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8th RPO Conference — Display Controller</title>
<!-- ============================================================
     8th Annual RPO Conference for Medical Facilities
     Live Display & Control application — single self-contained file.

     • Open this file            → CONTROL PANEL (operator hub)
     • Open with  #display       → DISPLAY VIEW (projector, 16:9)
     The control panel has an "Open Display Window" button that does
     this for you; both windows stay in sync via BroadcastChannel /
     localStorage. All data persists locally and can be exported and
     imported as JSON.

     Testing helpers on the display URL:
        index.html#display?scene=grid|spotlight|countdown|title
     ============================================================ -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap');

:root {
  /* ---- Conference palette ---- */
  --falls-gold:           #C9A227;
  --falls-gold-highlight: #F0DC8C;
  --gunmetal:             #2B2D2F;
  --charcoal:             #1A1B1D;
  --mist-white:           #F7F4EC;
  --pure-white:           #FFFFFF;
  --falls-mist:           #A8B5BD;
  --rpa-green:            #3A8B3A;
  --rpa-yellow:           #E5C100;

  /* ---- Typography ---- */
  --font-display: 'Cinzel', Cambria, Georgia, serif;
  --font-subhead: 'Playfair Display', Cambria, Georgia, serif;
  --font-body:    'Inter', Calibri, Arial, sans-serif;
  --font-mono:    'Roboto Mono', Consolas, 'Courier New', monospace;

  /* ---- Control-panel (light) tokens ---- */
  --cp-bg:      #F1EDE1;
  --cp-card:    #FFFFFF;
  --cp-border:  #E0DACA;
  --cp-text:    var(--gunmetal);
  --cp-dim:     #7C7668;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  font-family: var(--font-body);
  background: var(--cp-bg);
  color: var(--cp-text);
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 14px; color: var(--cp-text); }
img { max-width:100%; }

/* ══════════════════════════════════════════════════════════════
   SHARED — the 1920×1080 stage (used by display window & preview)
   ══════════════════════════════════════════════════════════════ */
.stage-wrap { position:relative; overflow:hidden; background:var(--charcoal); }
.stage {
  position:absolute; left:50%; top:50%;
  width:1920px; height:1080px;
  transform: translate(-50%,-50%) scale(1);
  transform-origin: center center;
  background: var(--charcoal);
  color: var(--mist-white);
  font-family: var(--font-body);
  overflow:hidden;
}

/* Victoria Falls mist motif — slow, subtle drift */
.mist { position:absolute; border-radius:50%; filter: blur(70px); pointer-events:none; }
.mist.m1 {
  width:1300px; height:700px; left:-250px; bottom:-420px;
  background: radial-gradient(ellipse, rgba(168,181,189,.13), transparent 65%);
  animation: drift1 38s ease-in-out infinite alternate;
}
.mist.m2 {
  width:1100px; height:620px; right:-300px; bottom:-380px;
  background: radial-gradient(ellipse, rgba(247,244,236,.08), transparent 65%);
  animation: drift2 46s ease-in-out infinite alternate;
}
.mist.m3 {
  width:900px; height:400px; left:30%; top:-320px;
  background: radial-gradient(ellipse, rgba(201,162,39,.05), transparent 70%);
  animation: drift1 52s ease-in-out infinite alternate-reverse;
}
@keyframes drift1 { from { transform: translateX(0) translateY(0);}   to { transform: translateX(160px) translateY(-40px);} }
@keyframes drift2 { from { transform: translateX(0) translateY(0);}   to { transform: translateX(-140px) translateY(-60px);} }

.vignette {
  position:absolute; inset:0; pointer-events:none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.35) 100%);
}

/* Scene container + transitions */
.scene { position:absolute; inset:0; animation: sceneIn .7s cubic-bezier(.22,.8,.3,1) both; }
.scene.out { animation: sceneOut .55s ease both; pointer-events:none; }
@keyframes sceneIn  { from { opacity:0; transform: scale(1.015);} to { opacity:1; transform: scale(1);} }
@keyframes sceneOut { from { opacity:1; transform: scale(1);}     to { opacity:0; transform: scale(.99);} }

/* Staggered element entrance — set --i per element */
.a { animation: rise .8s cubic-bezier(.2,.75,.3,1) both; animation-delay: calc(var(--i,0) * 95ms + 120ms); }
@keyframes rise { from { opacity:0; transform: translateY(26px);} to { opacity:1; transform: translateY(0);} }
.scene.no-anim, .scene.no-anim .a { animation-duration: 0s !important; animation-delay: 0s !important; }

/* Shared display type helpers */
.headline  { font-family: var(--font-display); color: var(--pure-white); letter-spacing: .04em; }
.tagline   { font-family: var(--font-subhead); font-style: italic; color: var(--falls-mist); }
.label     { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .14em; }
.gold-rule { height:3px; background: var(--falls-gold); border:0; }

/* Circular headshot (IAEA-style) */
.ph {
  border-radius:50%; object-fit:cover;
  border:4px solid var(--falls-gold);
  background: var(--gunmetal);
  display:flex; align-items:center; justify-content:center;
  flex:none;
}
.ph-init {
  font-family: var(--font-display); color: var(--falls-mist);
  font-weight:600; letter-spacing:.05em; user-select:none;
}

/* Typographic logo fallback (used only when no logo asset is present) */
.logo-fallback { text-align:center; line-height:1; }
.logo-fallback .lf-8 { font-family:var(--font-display); font-weight:700; color:var(--falls-gold); }
.logo-fallback .lf-t { font-family:var(--font-mono); letter-spacing:.28em; color:var(--mist-white); text-transform:uppercase; margin-top:.35em; }
.sc-title .t-logo .logo-fallback { font-size:82px; height:295px; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.g-brand .logo-fallback { font-size:40px; display:inline-block; }
.c-corner .logo-fallback { font-size:44px; display:inline-block; }
.t-host .logo-fallback { font-size:30px; }
.t-host .logo-fallback .lf-t { margin-top:0; }

/* ── SCENE: TITLE ─────────────────────────────────────────────── */
.sc-title { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:70px 120px; position:absolute; inset:0; }
.sc-title .t-logo img, .sc-title .t-logo .logo-fallback { height:295px; }
.sc-title .t-logo img { width:auto; }
.sc-title .t-kicker { font-size:22px; color:var(--falls-mist); margin-top:34px; }
.sc-title .t-name { font-size:84px; font-weight:600; margin-top:10px; line-height:1.08; }
.sc-title .t-sub  { font-size:30px; color:var(--falls-mist); font-family:var(--font-display); letter-spacing:.12em; text-transform:uppercase; margin-top:10px; }
.sc-title .t-rule { width:340px; margin:32px auto 26px; }
.sc-title .t-theme { font-size:37px; max-width:1250px; line-height:1.35; color:var(--mist-white); }
.sc-title .t-meta { font-size:23px; color:var(--falls-mist); margin-top:36px; }
.sc-title .t-host { display:flex; align-items:center; gap:20px; margin-top:34px; font-size:21px; color:var(--falls-mist); }
.sc-title .t-host img { height:64px; width:auto; }
.sc-footer { position:absolute; bottom:34px; left:0; right:0; text-align:center; font-size:17px; color:rgba(168,181,189,.55); }

/* ── SCENE: PANEL GRID ────────────────────────────────────────── */
.sc-grid { position:absolute; inset:0; padding:64px 90px 56px; display:flex; flex-direction:column; }
.sc-grid .g-head { display:flex; align-items:flex-end; justify-content:space-between; }
.sc-grid .g-title { font-size:56px; font-weight:600; line-height:1.1; }
.sc-grid .g-rule { width:220px; margin-top:16px; }
.sc-grid .g-brand { text-align:right; }
.sc-grid .g-brand img { height:200px; width:auto; }  /* brand rule: conference logo ≥200px */
.sc-grid .g-brand .label { display:block; font-size:16px; color:var(--falls-mist); margin-top:8px; }
.sc-grid .g-body { flex:1; display:flex; align-items:center; justify-content:center; margin-top:14px; }
.sc-grid .g-cells {
  display:grid; grid-template-columns: repeat(var(--cols,4), 1fr);
  gap: var(--gapy,34px) 44px; width:100%;
}
.g-card { display:flex; flex-direction:column; align-items:center; text-align:center; min-width:0; }
.g-card .ph { width:var(--ph,200px); height:var(--ph,200px); }
.g-card .ph-init { font-size: calc(var(--ph,200px) * .34); }
.g-card .c-name { font-family:var(--font-display); color:var(--pure-white); font-weight:600; font-size:var(--nm,26px); margin-top:18px; line-height:1.15; }
.g-card .c-org  { font-size:calc(var(--nm,26px) * .66); color:var(--falls-mist); margin-top:7px; line-height:1.3; }
.g-card .c-topic{
  font-size:calc(var(--nm,26px) * .62); color:rgba(247,244,236,.85); margin-top:8px; line-height:1.35;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; max-width:92%;
}
.sc-grid.dense .c-topic { display:none; }

/* ── SCENE: SPOTLIGHT ─────────────────────────────────────────── */
.sc-spot { position:absolute; inset:0; display:flex; align-items:center; padding:80px 110px; gap:96px; }
.sc-spot .s-left { flex:none; display:flex; flex-direction:column; align-items:center; gap:36px; }
.sc-spot .s-left .ph { width:500px; height:500px; border-width:6px; box-shadow: 0 0 0 14px rgba(201,162,39,.12), 0 30px 70px rgba(0,0,0,.55); }
.sc-spot .s-left .ph-init { font-size:170px; }
.sc-spot .s-chip {
  font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.14em; font-size:20px;
  color:var(--mist-white); border:1px solid rgba(168,181,189,.45); padding:12px 26px; border-radius:999px;
}
.sc-spot .s-right { flex:1; min-width:0; }
.sc-spot .s-cat { font-size:19px; color:var(--falls-mist); }
.sc-spot .s-name { font-size:76px; font-weight:600; line-height:1.06; margin-top:14px; }
.sc-spot .s-org { font-size:27px; color:var(--falls-mist); margin-top:16px; }
.sc-spot .s-rule { width:200px; margin:30px 0; }
.sc-spot .s-topic { font-size:35px; line-height:1.3; color:var(--mist-white); max-width:1000px; }
.sc-spot .s-bio { font-size:22px; line-height:1.62; color:rgba(247,244,236,.82); margin-top:30px; max-width:1000px;
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:8; overflow:hidden; }
.sc-spot .s-bio.long  { font-size:19px; -webkit-line-clamp:10; }
.sc-spot .s-bio.vlong { font-size:17px; -webkit-line-clamp:12; }

/* ── SCENE: COUNTDOWN & STATS ─────────────────────────────────── */
.sc-cd { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:70px 100px; }
.sc-cd .c-corner { position:absolute; top:42px; left:60px; }
.sc-cd .c-corner img { height:200px; width:auto; }  /* brand rule: conference logo ≥200px */
.sc-cd .c-corner .logo-fallback { height:auto; }
.sc-cd .c-clock { position:absolute; top:58px; right:70px; font-size:22px; color:var(--falls-mist); }
.sc-cd .c-kick { font-size:23px; color:var(--falls-mist); }
.sc-cd .c-session { font-family:var(--font-display); font-size:52px; font-weight:600; color:var(--pure-white); margin-top:16px; letter-spacing:.04em; }
.sc-cd .cd { display:flex; align-items:flex-start; justify-content:center; gap:34px; margin-top:44px; }
.sc-cd .cd-sep { font-family:var(--font-mono); font-size:130px; line-height:1; color:rgba(201,162,39,.5); padding-top:16px; }
.cd-block { text-align:center; }
.cd-num {
  font-family:var(--font-mono); font-size:168px; line-height:1; font-weight:500;
  color:var(--falls-gold);
  text-shadow: 0 0 60px rgba(201,162,39,.22);
  font-variant-numeric: tabular-nums;
  min-width:2.05ch;
}
.cd-num.pop { animation: numpop .45s ease; }
@keyframes numpop { 0%{transform:translateY(6px); opacity:.35;} 100%{transform:translateY(0); opacity:1;} }
.cd-lab { font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.22em; font-size:19px; color:var(--falls-mist); margin-top:16px; }
.sc-cd .cd-now {
  font-family:var(--font-mono); font-size:120px; letter-spacing:.1em; color:var(--falls-gold);
  margin-top:52px; text-transform:uppercase; animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.45;} }
.sc-cd .c-rule { width:260px; margin:52px auto 0; }
.sc-cd .c-stats { display:flex; gap:110px; margin-top:44px; }
.c-stat .st-v { font-family:var(--font-mono); font-size:56px; color:var(--pure-white); font-variant-numeric:tabular-nums; }
.c-stat .st-l { font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.2em; font-size:17px; color:var(--falls-mist); margin-top:10px; }
.sc-cd .c-theme { font-size:27px; margin-top:52px; max-width:1150px; }

/* ── Blackout ─────────────────────────────────────────────────── */
.blackout { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .8s ease; z-index:60; }
.blackout.on { opacity:1; pointer-events:auto; }

/* ══════════════════════════════════════════════════════════════
   DISPLAY MODE chrome
   ══════════════════════════════════════════════════════════════ */
body.mode-display { background:#000; overflow:hidden; }
#displayRoot { position:fixed; inset:0; }
#displayRoot .stage-wrap { position:absolute; inset:0; background:#000; }
.disp-ui {
  position:fixed; right:22px; bottom:22px; z-index:80; display:flex; gap:10px;
  opacity:0; transition:opacity .4s;
}
body.mode-display:not(.idle) .disp-ui { opacity:1; }
body.mode-display.idle { cursor:none; }
.disp-btn {
  background:rgba(43,45,47,.85); color:var(--mist-white); border:1px solid rgba(168,181,189,.35);
  border-radius:8px; padding:10px 18px; font-size:14px; font-family:var(--font-body);
}
.disp-btn:hover { border-color:var(--falls-gold); color:var(--falls-gold-highlight); }
.disp-btn.gold { background:var(--falls-gold); border-color:var(--falls-gold); color:var(--charcoal); font-weight:600; }
.disp-btn.gold:hover { background:var(--falls-gold-highlight); color:var(--charcoal); }

/* Banner shown on the display window until it goes fullscreen (or is dismissed) */
.disp-banner {
  position:fixed; top:0; left:0; right:0; z-index:55;
  display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap;
  background:rgba(26,27,29,.94); border-bottom:1px solid rgba(201,162,39,.55);
  padding:11px 18px; font-family:var(--font-body); font-size:14.5px; color:var(--mist-white);
  text-align:center;
}
.disp-banner b { color:var(--falls-gold-highlight); font-family:var(--font-mono); letter-spacing:.14em; font-weight:500; }
body.mode-display.is-fs .disp-banner { display:none; }

/* ══════════════════════════════════════════════════════════════
   CONTROL PANEL
   ══════════════════════════════════════════════════════════════ */
#controlRoot { min-height:100vh; display:flex; flex-direction:column; }
.cp-header {
  background: var(--gunmetal); color: var(--mist-white);
  padding: 14px 26px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
}
.cp-header .hd-mark {
  width:44px; height:44px; border-radius:50%; flex:none; overflow:hidden;
  border:2px solid var(--falls-gold); background:var(--charcoal);
  display:flex; align-items:center; justify-content:center;
}
.cp-header .hd-mark img { width:100%; height:100%; object-fit:contain; padding:3px; }
.cp-header .hd-mark span { font-family:var(--font-display); color:var(--falls-gold); font-weight:700; font-size:19px; }
.cp-header h1 { font-family:var(--font-display); font-size:19px; font-weight:600; letter-spacing:.05em; line-height:1.2; }
.cp-header .hd-sub { font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--falls-mist); margin-top:3px; }
.cp-header .hd-spacer { flex:1; }
.hd-status { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--falls-mist); margin-right:6px; }
.hd-dot { width:9px; height:9px; border-radius:50%; background:#666; flex:none; }
.hd-dot.on { background:#4CC26B; box-shadow:0 0 8px rgba(76,194,107,.7); }

.btn {
  border:1px solid var(--cp-border); background:var(--cp-card); color:var(--cp-text);
  border-radius:8px; padding:9px 16px; font-size:13.5px; font-weight:600;
  transition: all .15s ease; white-space:nowrap;
}
.btn:hover { border-color:var(--falls-gold); }
.btn.gold { background:var(--falls-gold); border-color:var(--falls-gold); color:var(--charcoal); }
.btn.gold:hover { background:#B8931F; }
.btn.dark { background:var(--gunmetal); border-color:var(--gunmetal); color:var(--mist-white); }
.btn.dark:hover { background:#3A3D40; }
.btn.danger { color:#B03030; }
.btn.danger:hover { border-color:#B03030; }
.btn.sm { padding:5px 10px; font-size:12px; border-radius:6px; }
.btn.big { padding:13px 26px; font-size:15px; border-radius:10px; letter-spacing:.02em; }
.btn:disabled { opacity:.45; cursor:not-allowed; }

.cp-main {
  flex:1; display:grid; grid-template-columns: minmax(520px, 46%) 1fr;
  gap:22px; padding:22px 26px; align-items:start; max-width:1800px; width:100%; margin:0 auto;
}
@media (max-width: 1150px){ .cp-main { grid-template-columns: 1fr; } }

.card { background:var(--cp-card); border:1px solid var(--cp-border); border-radius:14px; overflow:hidden; }
.card-h { padding:14px 18px; border-bottom:1px solid var(--cp-border); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.card-h .ttl { font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.16em; font-size:12px; color:var(--cp-dim); font-weight:500; }
.card-b { padding:18px; }

/* Live preview */
.preview-wrap { position:relative; width:100%; aspect-ratio:16/9; background:var(--charcoal); }
.preview-wrap .stage-wrap { position:absolute; inset:0; }
.live-badge {
  position:absolute; top:10px; left:10px; z-index:40; display:flex; align-items:center; gap:7px;
  background:rgba(0,0,0,.55); border-radius:999px; padding:5px 13px 5px 9px;
  font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#fff;
}
.live-badge .pulse-dot { width:8px; height:8px; border-radius:50%; background:#E5484D; animation:pulse 1.4s infinite; }
.preview-hint { font-size:12px; color:var(--cp-dim); padding:10px 18px 0; }

/* Scene tabs & configs */
.scene-tabs { display:flex; gap:8px; flex-wrap:wrap; padding:16px 18px 0; }
.stab {
  position:relative; border:1.5px solid var(--cp-border); background:var(--cp-card);
  border-radius:9px; padding:10px 16px; font-size:13.5px; font-weight:600; color:var(--cp-text);
}
.stab:hover { border-color:var(--falls-gold); }
.stab.active { background:var(--gunmetal); border-color:var(--gunmetal); color:#fff; }
.stab .ondot { position:absolute; top:-5px; right:-5px; width:11px; height:11px; border-radius:50%;
  background:#E5484D; border:2px solid var(--cp-card); display:none; }
.stab.is-live .ondot { display:block; }
.stab.blackout-btn { margin-left:auto; }
.stab.blackout-btn.bo-on { background:#000; border-color:#000; color:var(--falls-gold-highlight); }

.scene-config { padding:16px 18px 18px; }
.scene-config .desc { font-size:13px; color:var(--cp-dim); margin-bottom:14px; line-height:1.5; }
.frow { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px; }
.fld { display:flex; flex-direction:column; gap:5px; min-width:0; }
.fld label { font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--cp-dim); }
.fld input, .fld select, .fld textarea {
  border:1px solid var(--cp-border); border-radius:8px; padding:9px 11px; background:#FCFAF4; outline:none;
}
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color:var(--falls-gold); }
.fld.grow { flex:1; }
.push-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

.spot-nav { display:flex; gap:8px; align-items:center; }
.spot-info { font-size:12.5px; color:var(--cp-dim); margin-top:10px; line-height:1.5; }

.quickbtns { display:flex; gap:6px; flex-wrap:wrap; }

/* People manager */
.pp-tools { display:flex; gap:10px; flex-wrap:wrap; align-items:center; flex:1; }
.pp-tools input[type=search], .pp-tools select {
  border:1px solid var(--cp-border); border-radius:8px; padding:8px 11px; background:#FCFAF4; outline:none;
}
.pp-tools input[type=search]{ flex:1; min-width:140px; }
.pp-count { font-size:12px; color:var(--cp-dim); }
.pp-list { max-height: 640px; overflow-y:auto; }
.pp-row {
  display:flex; align-items:center; gap:13px; padding:11px 18px;
  border-bottom:1px solid #EFEADD;
}
.pp-row:hover { background:#FAF7EE; }
.pp-row .ph { width:46px; height:46px; border-width:2px; }
.pp-row .ph-init { font-size:16px; }
.pp-info { flex:1; min-width:0; }
.pp-name { font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pp-meta { font-size:12px; color:var(--cp-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.chip {
  display:inline-block; font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  border-radius:999px; padding:2.5px 9px; margin-right:7px; vertical-align:1px;
  background:#EEE9DB; color:#6A6455;
}
.chip.c-keynote   { background:#F4E8C3; color:#8A6D0E; }
.chip.c-speaker   { background:#E2E8EC; color:#4A6474; }
.chip.c-panellist { background:#DDEBDD; color:#2E6B2E; }
.chip.c-official  { background:#E5E0F0; color:#584B7E; }
.chip.c-committee { background:#F0E2D8; color:#8A5A34; }
.pp-actions { display:flex; gap:5px; align-items:center; flex:none; }
.icobtn {
  border:1px solid transparent; background:none; border-radius:6px; padding:5px 7px; font-size:13px;
  color:var(--cp-dim); line-height:1;
}
.icobtn:hover { border-color:var(--cp-border); background:#fff; color:var(--cp-text); }
.icobtn.warn:hover { color:#B03030; border-color:#E8C5C5; }
.pp-empty { padding:40px 20px; text-align:center; color:var(--cp-dim); font-size:14px; line-height:1.7; }

/* Modal */
.modal-veil {
  position:fixed; inset:0; background:rgba(26,27,29,.55); z-index:200;
  display:flex; align-items:flex-start; justify-content:center; padding:40px 18px; overflow-y:auto;
  animation: veilIn .18s ease;
}
@keyframes veilIn { from{opacity:0;} to{opacity:1;} }
.modal {
  background:var(--cp-card); border-radius:16px; width:100%; max-width:660px;
  animation: modIn .22s cubic-bezier(.2,.8,.3,1);
  box-shadow: 0 30px 80px rgba(0,0,0,.35);
}
@keyframes modIn { from{opacity:0; transform:translateY(14px) scale(.985);} to{opacity:1; transform:none;} }
.modal .m-h { padding:18px 22px; border-bottom:1px solid var(--cp-border); display:flex; align-items:center; }
.modal .m-h h2 { font-family:var(--font-display); font-size:18px; font-weight:600; letter-spacing:.03em; }
.modal .m-h .x { margin-left:auto; }
.modal .m-b { padding:20px 22px; }
.modal .m-f { padding:16px 22px; border-top:1px solid var(--cp-border); display:flex; gap:10px; justify-content:flex-end; align-items:center; }

.photo-drop {
  display:flex; align-items:center; gap:16px;
}
.photo-drop .ph { width:84px; height:84px; }
.photo-drop .ph-init { font-size:26px; }
.settings-sec { font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.15em; font-size:11px;
  color:var(--cp-dim); margin:22px 0 12px; padding-top:16px; border-top:1px dashed var(--cp-border); }
.settings-sec:first-child { margin-top:0; padding-top:0; border-top:0; }
.logo-slot { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
.logo-slot .lg-prev {
  width:110px; height:64px; border-radius:8px; background:var(--charcoal); flex:none;
  display:flex; align-items:center; justify-content:center; border:1px solid var(--cp-border); overflow:hidden;
}
.logo-slot .lg-prev img { max-width:96%; max-height:90%; object-fit:contain; }
.logo-slot .lg-prev span { color:var(--falls-mist); font-size:10.5px; font-family:var(--font-mono); letter-spacing:.1em; }
.logo-slot .lg-info { flex:1; font-size:12px; color:var(--cp-dim); line-height:1.5; }

/* Toasts */
#toasts { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:400; display:flex; flex-direction:column; gap:8px; align-items:center; }
.toast {
  background:var(--gunmetal); color:var(--mist-white); border-left:3px solid var(--falls-gold);
  padding:11px 20px; border-radius:9px; font-size:13.5px; box-shadow:0 12px 32px rgba(0,0,0,.3);
  animation: toastIn .25s cubic-bezier(.2,.8,.3,1);
}
@keyframes toastIn { from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }
.toast.fade { opacity:0; transition:opacity .4s; }

.cp-foot { text-align:center; font-size:12px; color:var(--cp-dim); padding:8px 20px 22px; font-style:italic; font-family:var(--font-subhead); }

/* Fullscreen preview: make the wrap fill the screen */
.preview-wrap:fullscreen { aspect-ratio:auto; }
.preview-wrap:fullscreen .stage-wrap { position:absolute; inset:0; }

::-webkit-scrollbar { width:10px; }
::-webkit-scrollbar-thumb { background:#D5CFBE; border-radius:5px; }
::-webkit-scrollbar-track { background:transparent; }
</style>
</head>
<body>
<div id="controlRoot" hidden></div>
<div id="displayRoot" hidden></div>
<div id="toasts"></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════
   0. UTILITIES
   ════════════════════════════════════════════════════════════════ */
const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'p' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad2 = n => String(n).padStart(2, '0');

/* localStorage may be unavailable (sandboxed iframe) — degrade to memory */
const store = (() => {
  try {
    const t = '__rpo8t'; localStorage.setItem(t, '1'); localStorage.removeItem(t);
    return localStorage;
  } catch (e) {
    const mem = {};
    return { getItem: k => (k in mem ? mem[k] : null), setItem: (k, v) => { mem[k] = String(v); }, removeItem: k => { delete mem[k]; } };
  }
})();
const LS_KEY = 'rpo8.display.state.v1';

function toast(msg, ms = 2600) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('fade'); setTimeout(() => t.remove(), 450); }, ms);
}

/* Resize an uploaded image to a data-URL (photos → JPEG, logos → PNG) */
function processImage(file, maxDim = 640, type = 'image/jpeg', quality = 0.85) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL(type, quality));
      };
      img.onerror = reject;
      img.src = fr.result;
    };
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}

/* ════════════════════════════════════════════════════════════════
   1. STATE — data model, defaults, sample data, persistence
   ════════════════════════════════════════════════════════════════ */
const CATEGORIES = ['Keynote', 'Speaker', 'Panellist', 'RPA/RPO Official', 'Organising Committee'];
const HONORIFICS = ['Prof', 'Dr', 'Mr', 'Mrs', 'Ms', 'Madam', 'Eng', 'Hon'];

const SAMPLE_PEOPLE = [
  { honorific:'Dr',    name:'Chanda Mwale',   org:'Radiation Protection Authority of Zambia', topic:'From Compliance to Culture: The Next Decade of Radiation Safety in Zambia', session:'Opening Session', slot:'Tue 09:00', category:'Keynote', bio:'Dr Chanda Mwale is the Director of Radiation Safety at the Radiation Protection Authority of Zambia, with over twenty years of experience in regulatory oversight of medical radiation facilities. He has led the national programme for licensing and inspection of diagnostic radiology, radiotherapy and nuclear medicine services, and championed the shift from compliance-driven regulation to a genuine culture of safety across the health sector.' },
  { honorific:'Prof',  name:'Naomi Banda',    org:'University Teaching Hospitals, Lusaka',    topic:'Optimising Patient Dose in CT: Findings from a Multi-Centre Audit', session:'Session 2', slot:'Tue 11:30', category:'Speaker', bio:'Prof Naomi Banda is a consultant radiologist and professor of medical imaging at the University Teaching Hospitals in Lusaka. Her research focuses on dose optimisation in computed tomography and the establishment of national diagnostic reference levels for Zambia.' },
  { honorific:'Mr',    name:'Joseph Phiri',   org:'Cancer Diseases Hospital, Lusaka',         topic:'Quality Assurance in Radiotherapy: Practical Lessons from the Clinic', session:'Session 2', slot:'Tue 12:00', category:'Speaker', bio:'Mr Joseph Phiri is the chief medical physicist at the Cancer Diseases Hospital, where he oversees quality assurance for external beam radiotherapy and brachytherapy. He serves on several national committees on radiation safety in medicine.' },
  { honorific:'Ms',    name:'Grace Tembo',    org:'Ndola Teaching Hospital',                  topic:'Building a Safety Culture in the Imaging Department', session:'Panel Discussion', slot:'Wed 14:00', category:'Panellist', bio:'Ms Grace Tembo is the principal radiographer at Ndola Teaching Hospital and a certified Radiation Protection Officer. She has pioneered peer-learning programmes that embed radiation safety practice among frontline imaging staff.' },
  { honorific:'Dr',    name:'Emmanuel Zulu',  org:'Radiation Protection Authority of Zambia', topic:'Regulatory Update: Licensing and Inspection Outlook 2026–2028', session:'Session 4', slot:'Wed 09:30', category:'RPA/RPO Official', bio:'Dr Emmanuel Zulu heads the Authorisation and Inspection Unit of the RPA. He coordinates the national inspection schedule for medical facilities and is leading the roll-out of the new graded-approach licensing framework.' },
  { honorific:'Madam', name:'Ruth Chirwa',    org:'Livingstone Central Hospital',             topic:'Conference Coordination & Delegate Liaison', session:'—', slot:'', category:'Organising Committee', bio:'Madam Ruth Chirwa chairs the local organising committee for the 8th RPO Conference. She is the senior Radiation Protection Officer at Livingstone Central Hospital and has hosted three previous national radiation safety workshops.' },
];

function defaultState(withSamples) {
  return {
    rev: 1,
    settings: {
      eventName: '8th Annual RPO Conference',
      eventSub: 'for Medical Facilities',
      theme: 'Sustaining Excellence in Radiation Safety: From Compliance to Culture',
      datesText: '14–17 JULY 2026',
      venueText: 'DAVID LIVINGSTONE SAFARI LODGE · LIVINGSTONE, ZAMBIA',
      hostText: 'Hosted by the Radiation Protection Authority of Zambia',
      hashtags: '#RPOConference2026   #RadiationSafety   #RPAZambia',
      showHashtags: true,
      startDate: '2026-07-14',
      totalDays: 4,
      dayOverride: 'auto',
      sessionsOverride: '',
      countdownTarget: '',
      countdownLabel: 'Opening Ceremony',
    },
    assets: { confLogo: null, rpaLogo: null },
    people: withSamples ? SAMPLE_PEOPLE.map(p => ({ id: uid(), photo: null, ...p })) : [],
    live: { scene: 'title', params: {}, blackout: false, pushedAt: 0 },
  };
}

let state = null;
function loadState() {
  try {
    const raw = store.getItem(LS_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.people) && s.settings) {
        state = Object.assign(defaultState(false), s);
        state.settings = Object.assign(defaultState(false).settings, s.settings);
        return;
      }
    }
  } catch (e) { /* fall through to defaults */ }
  state = defaultState(true);
  persist(false);
}

let bc = null;
try { bc = new BroadcastChannel('rpo8-live-sync'); } catch (e) {}

function persist(broadcast = true) {
  state.rev++;
  try { store.setItem(LS_KEY, JSON.stringify(state)); }
  catch (e) { toast('⚠ Storage is full — photo may be too large. Data kept in memory only.'); }
  if (broadcast && bc) { try { bc.postMessage({ type: 'state', state }); } catch (e) {} }
}

/* ════════════════════════════════════════════════════════════════
   2. DERIVED DATA helpers
   ════════════════════════════════════════════════════════════════ */
function allCategories() {
  const set = new Set(CATEGORIES);
  state.people.forEach(p => p.category && set.add(p.category));
  return [...set];
}
function peopleInCategory(cat) {
  return (!cat || cat === 'All') ? state.people.slice() : state.people.filter(p => p.category === cat);
}
function personById(id) { return state.people.find(p => p.id === id) || null; }
function fullName(p) { return [p.honorific, p.name].filter(Boolean).join(' '); }
function initialsOf(p) {
  return (p.name || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
}
function sessionsCount() {
  const o = state.settings.sessionsOverride;
  if (o !== '' && o != null && !isNaN(+o)) return +o;
  const set = new Set();
  state.people.forEach(p => { const s = (p.session || '').trim(); if (s && s !== '—') set.add(s.toLowerCase()); });
  return set.size;
}
function dayOfConference() {
  const s = state.settings;
  if (s.dayOverride !== 'auto') return Math.max(1, Math.min(+s.dayOverride, s.totalDays || 4));
  const start = new Date((s.startDate || '2026-07-14') + 'T00:00:00');
  const d = Math.floor((Date.now() - start.getTime()) / 864e5) + 1;
  return Math.max(1, Math.min(d, s.totalDays || 4));
}
function gridTitleFor(cat) {
  const map = { 'All': 'Our Speakers', 'Keynote': 'Keynote Speakers', 'Speaker': 'Speakers',
    'Panellist': 'Panellists', 'RPA/RPO Official': 'RPA & RPO Officials', 'Organising Committee': 'Organising Committee' };
  return map[cat] || cat;
}
function catChipClass(cat) {
  const map = { 'Keynote':'c-keynote','Speaker':'c-speaker','Panellist':'c-panellist','RPA/RPO Official':'c-official','Organising Committee':'c-committee' };
  return map[cat] || '';
}

/* Logo resolution: uploaded asset → ./logos/ file (if present) → typographic fallback */
function logoHTML(kind, cls) {
  const asset = kind === 'conf' ? state.assets.confLogo : state.assets.rpaLogo;
  const file  = kind === 'conf' ? 'logos/conf_logo_transparent.png' : 'logos/rpa_logo.png';
  const fall  = kind === 'conf'
    ? `<div class="logo-fallback ${cls || ''}"><div class="lf-8" style="font-size:2.4em">8<span style="font-size:.55em">TH</span></div><div class="lf-t" style="font-size:.5em">RPO Conference</div></div>`
    : `<div class="logo-fallback ${cls || ''}"><div class="lf-t" style="font-size:.8em;color:var(--rpa-green)">RPA</div></div>`;
  if (asset) return `<img class="${cls || ''}" src="${asset}" alt="">`;
  /* try the file on disk; if it 404s, swap in the typographic fallback */
  return `<img class="${cls || ''}" src="${file}" alt="" onerror="this.outerHTML=${esc(JSON.stringify(fall))}">`;
}

/* ════════════════════════════════════════════════════════════════
   3. SCENES — HTML builders for the 1920×1080 stage
   ════════════════════════════════════════════════════════════════ */
function photoCircleHTML(p) {
  if (p.photo) return `<img class="ph" src="${p.photo}" alt="">`;
  return `<div class="ph"><span class="ph-init">${esc(initialsOf(p))}</span></div>`;
}
function footerHTML() {
  const s = state.settings;
  if (!s.showHashtags || !s.hashtags) return '';
  return `<div class="sc-footer label a" style="--i:9">${esc(s.hashtags)}</div>`;
}

function sceneTitle() {
  const s = state.settings;
  return `<div class="sc-title">
    <div class="t-logo a" style="--i:0">${logoHTML('conf')}</div>
    <div class="t-name headline a" style="--i:1">${esc(s.eventName)}</div>
    ${s.eventSub ? `<div class="t-sub a" style="--i:2">${esc(s.eventSub)}</div>` : ''}
    <hr class="gold-rule t-rule a" style="--i:3">
    <div class="t-theme tagline a" style="--i:4">“${esc(s.theme)}”</div>
    <div class="t-meta label a" style="--i:5">${esc(s.datesText)}&ensp;·&ensp;${esc(s.venueText)}</div>
    <div class="t-host a" style="--i:6">${logoHTML('rpa')}<span>${esc(s.hostText)}</span></div>
    ${footerHTML()}
  </div>`;
}

function gridMetrics(n) {
  let cols;
  if (n <= 4) cols = Math.max(n, 1);
  else if (n <= 8) cols = 4;
  else if (n <= 10) cols = 5;
  else if (n <= 12) cols = 6;
  else if (n <= 15) cols = 5;
  else if (n <= 18) cols = 6;
  else cols = 7;
  const rows = Math.ceil(n / cols);
  const ph = rows <= 1 ? 262 : rows === 2 ? 205 : rows === 3 ? 148 : 116;
  const nm = rows <= 1 ? 30 : rows === 2 ? 26 : rows === 3 ? 21 : 18;
  const gapy = rows <= 2 ? 36 : 22;
  return { cols, rows, ph, nm, gapy, dense: rows >= 4 };
}

function sceneGrid(params) {
  const cat = params.category || 'All';
  const people = peopleInCategory(cat);
  const title = params.title || gridTitleFor(cat);
  const m = gridMetrics(people.length);
  const cells = people.map((p, i) => `
    <div class="g-card a" style="--i:${i + 2}">
      ${photoCircleHTML(p)}
      <div class="c-name">${esc(fullName(p))}</div>
      <div class="c-org">${esc(p.org || '')}</div>
      <div class="c-topic">${esc(p.topic || '')}</div>
    </div>`).join('');
  const empty = `<div class="tagline" style="font-size:34px">No people in this group yet — add them in the control panel.</div>`;
  return `<div class="sc-grid ${m.dense ? 'dense' : ''}">
    <div class="g-head">
      <div class="a" style="--i:0">
        <div class="g-title headline">${esc(title)}</div>
        <hr class="gold-rule g-rule">
      </div>
      <div class="g-brand a" style="--i:1">
        ${logoHTML('conf')}
        <span class="label">${esc(state.settings.datesText)} · LIVINGSTONE</span>
      </div>
    </div>
    <div class="g-body">
      ${people.length ? `<div class="g-cells" style="--cols:${m.cols}; --ph:${m.ph}px; --nm:${m.nm}px; --gapy:${m.gapy}px">${cells}</div>` : empty}
    </div>
  </div>`;
}

function sceneSpotlight(params) {
  const p = personById(params.personId) || state.people[0];
  if (!p) return `<div class="sc-title"><div class="tagline" style="font-size:34px">Add a person in the control panel to use the spotlight.</div></div>`;
  const bioLen = (p.bio || '').length;
  const bioCls = bioLen > 950 ? 'vlong' : bioLen > 620 ? 'long' : '';
  const chip = [p.session, p.slot].filter(x => x && x !== '—').join(' · ');
  return `<div class="sc-spot">
    <div class="s-left">
      <div class="a" style="--i:0">${photoCircleHTML(p)}</div>
      ${chip ? `<div class="s-chip a" style="--i:4">${esc(chip)}</div>` : ''}
    </div>
    <div class="s-right">
      <div class="s-cat label a" style="--i:1">${esc(p.category || 'Speaker')}</div>
      <div class="s-name headline a" style="--i:1">${esc(fullName(p))}</div>
      <div class="s-org a" style="--i:2">${esc(p.org || '')}</div>
      <hr class="gold-rule s-rule a" style="--i:2">
      ${p.topic ? `<div class="s-topic tagline a" style="--i:3" >“${esc(p.topic)}”</div>` : ''}
      ${p.bio ? `<div class="s-bio ${bioCls} a" style="--i:4">${esc(p.bio)}</div>` : ''}
    </div>
  </div>`;
}

function sceneCountdown() {
  const s = state.settings;
  const target = s.countdownTarget;
  const stats = [
    { v: `${dayOfConference()}<span style="opacity:.55;font-size:.6em"> / ${s.totalDays || 4}</span>`, l: 'Day of Conference' },
    { v: String(sessionsCount() || '—'), l: 'Sessions' },
    { v: String(state.people.length || '—'), l: 'Speakers & Guests' },
  ];
  const statHTML = stats.map((st, i) =>
    `<div class="c-stat a" style="--i:${i + 4}"><div class="st-v">${st.v}</div><div class="st-l">${esc(st.l)}</div></div>`).join('');
  const cdBlocks = `
    <div class="cd a" style="--i:2" data-cd="${esc(target)}">
      <div class="cd-block" data-b="d"><div class="cd-num" data-u="d">–</div><div class="cd-lab">Days</div></div>
      <div class="cd-sep" data-b="d">:</div>
      <div class="cd-block"><div class="cd-num" data-u="h">––</div><div class="cd-lab">Hours</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-block"><div class="cd-num" data-u="m">––</div><div class="cd-lab">Minutes</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-block"><div class="cd-num" data-u="s">––</div><div class="cd-lab">Seconds</div></div>
    </div>
    <div class="cd-now a" style="--i:2" data-cd-now hidden>Starting&nbsp;Now</div>`;
  return `<div class="sc-cd">
    <div class="c-corner a" style="--i:0">${logoHTML('conf')}</div>
    <div class="c-clock label a" style="--i:0" data-clock></div>
    <div class="c-kick label a" style="--i:0">${target ? 'Next Session Begins In' : 'Welcome To'}</div>
    <div class="c-session a" style="--i:1">${esc(target ? (s.countdownLabel || 'Next Session') : s.eventName)}</div>
    ${target ? cdBlocks : ''}
    <hr class="gold-rule c-rule a" style="--i:3">
    <div class="c-stats">${statHTML}</div>
    <div class="c-theme tagline a" style="--i:7">“${esc(s.theme)}”</div>
    ${footerHTML()}
  </div>`;
}

function buildSceneHTML(live) {
  switch (live.scene) {
    case 'grid':      return sceneGrid(live.params || {});
    case 'spotlight': return sceneSpotlight(live.params || {});
    case 'countdown': return sceneCountdown();
    case 'title':
    default:          return sceneTitle();
  }
}

/* ════════════════════════════════════════════════════════════════
   4. STAGE mounting, scaling, transitions, tickers
   ════════════════════════════════════════════════════════════════ */
function makeStage(host) {
  host.classList.add('stage-wrap');
  host.innerHTML = `
    <div class="stage">
      <div class="mist m1"></div><div class="mist m2"></div><div class="mist m3"></div>
      <div class="vignette"></div>
      <div class="scene-slot" style="position:absolute;inset:0"></div>
      <div class="blackout"></div>
    </div>`;
  const stage = $('.stage', host);
  const fit = () => {
    const r = host.getBoundingClientRect();
    if (r.width && r.height) stage.style.transform = `translate(-50%,-50%) scale(${Math.min(r.width / 1920, r.height / 1080)})`;
  };
  new ResizeObserver(fit).observe(host);
  fit();
  return {
    host, stage,
    lastKey: null,
    mount(live, animate = true) {
      const key = JSON.stringify({ s: live.scene, p: live.params, at: live.pushedAt });
      const contentChanged = key !== this.lastKey;
      this.lastKey = key;
      const slot = $('.scene-slot', stage);
      const old = $('.scene', slot);
      const sc = document.createElement('div');
      sc.className = 'scene' + ((animate && contentChanged) ? '' : ' no-anim');
      sc.innerHTML = buildSceneHTML(live);
      slot.appendChild(sc);
      if (old) { old.classList.add('out'); setTimeout(() => old.remove(), 620); }
      $('.blackout', stage).classList.toggle('on', !!live.blackout);
      tick(); // immediate countdown/clock fill
    },
    setBlackout(on) { $('.blackout', stage).classList.toggle('on', !!on); },
  };
}

/* Global 300 ms ticker — feeds countdowns and clocks on any mounted stage */
function tick() {
  const now = new Date();
  $$('[data-clock]').forEach(el => {
    el.textContent = `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
  });
  $$('[data-cd]').forEach(cd => {
    const t = new Date(cd.dataset.cd).getTime();
    if (isNaN(t)) return;
    let ms = t - Date.now();
    const done = ms <= 0; if (done) ms = 0;
    const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24,
          m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
    const vals = { d: String(d), h: pad2(h), m: pad2(m), s: pad2(s) };
    cd.querySelectorAll('[data-b="d"]').forEach(el => { el.style.display = d > 0 ? '' : 'none'; });
    for (const [u, v] of Object.entries(vals)) {
      const el = cd.querySelector(`[data-u="${u}"]`);
      if (el && el.textContent !== v) {
        el.textContent = v;
        el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
      }
    }
    const nowEl = cd.parentElement.querySelector('[data-cd-now]');
    cd.style.display = done ? 'none' : '';
    if (nowEl) nowEl.hidden = !done;
  });
}
setInterval(tick, 300);

/* ════════════════════════════════════════════════════════════════
   5. DISPLAY MODE (projector window)
   ════════════════════════════════════════════════════════════════ */
const IS_DISPLAY = /display/.test(location.hash) || new URLSearchParams(location.search).has('display');

function initDisplay() {
  document.body.classList.add('mode-display');
  const root = $('#displayRoot'); root.hidden = false;
  root.innerHTML = `<div class="disp-host" style="position:absolute;inset:0"></div>
    <div class="disp-banner" id="dispBanner">
      <span><b>PROJECTOR OUTPUT</b> — this window is what the audience sees. Drag it onto the projector / second screen, then go fullscreen.</span>
      <button class="disp-btn gold" id="btnBannerFs">⛶&ensp;Go fullscreen</button>
      <button class="disp-btn" id="btnBannerX" title="Hide this bar">✕</button>
    </div>
    <div class="disp-ui">
      <button class="disp-btn" id="btnFs">⛶&ensp;Fullscreen&ensp;(F)</button>
    </div>`;
  const stagePort = makeStage($('.disp-host', root));

  /* testing helper: #display?scene=grid forces a scene locally */
  const q = new URLSearchParams((location.hash.split('?')[1] || location.search.slice(1)) || '');
  const forced = q.get('scene');
  function currentLive() {
    if (!forced) return state.live;
    const params = {};
    if (forced === 'spotlight') params.personId = (state.people[+(q.get('person') || 0)] || {}).id;
    if (forced === 'grid') params.category = q.get('category') || 'All';
    if (forced === 'countdown' && !state.settings.countdownTarget) {
      state.settings.countdownTarget = new Date(Date.now() + 15 * 6e4).toISOString().slice(0, 16);
    }
    return { scene: forced, params, blackout: false, pushedAt: 1 };
  }

  stagePort.mount(currentLive());

  const applyIncoming = (ns) => {
    const liveChanged = JSON.stringify(ns.live) !== JSON.stringify(state.live);
    const dataChanged = ns.rev !== state.rev;
    state = ns;
    if (forced) return;
    if (liveChanged || dataChanged) stagePort.mount(state.live, liveChanged);
  };

  if (bc) bc.onmessage = (e) => {
    const d = e.data || {};
    if (d.type === 'state' && d.state) applyIncoming(d.state);
    if (d.type === 'ping') { try { bc.postMessage({ type: 'display-online' }); } catch (err) {} }
  };
  /* storage-event + polling fallbacks (covers file:// quirks) */
  window.addEventListener('storage', (e) => {
    if (e.key === LS_KEY && e.newValue) { try { applyIncoming(JSON.parse(e.newValue)); } catch (err) {} }
  });
  setInterval(() => {
    try {
      const raw = store.getItem(LS_KEY); if (!raw) return;
      const s = JSON.parse(raw);
      if (s && s.rev !== state.rev) applyIncoming(s);
    } catch (e) {}
  }, 1500);

  /* fullscreen + idle cursor */
  const goFs = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => toast('Fullscreen was blocked by the browser'));
  };
  $('#btnFs').onclick = goFs;
  $('#btnBannerFs').onclick = goFs;
  $('#btnBannerX').onclick = () => { $('#dispBanner').remove(); };
  document.addEventListener('fullscreenchange', () =>
    document.body.classList.toggle('is-fs', !!document.fullscreenElement));
  window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'f') goFs(); });
  window.addEventListener('dblclick', goFs);
  let idleT;
  const wake = () => {
    document.body.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(() => document.body.classList.add('idle'), 3200);
  };
  window.addEventListener('mousemove', wake); wake();
}

const ui = { sceneTab: 'title', q: '', catFilter: 'All', displayLastSeen: 0 };
let preview = null;

function pushLive(scene, params = {}) {
  state.live = { ...state.live, scene, params, pushedAt: Date.now() };
  persist();
  preview && preview.mount(state.live, true);
  renderSceneTabs();
  toast(`Pushed “${sceneLabel(scene)}” to the display`);
}
function sceneLabel(s) {
  return { title: 'Title / Welcome', grid: 'Panel Grid', spotlight: 'Speaker Spotlight', countdown: 'Countdown & Stats' }[s] || s;
}

function initControl() {
  const root = $('#controlRoot'); root.hidden = false;
  root.innerHTML = `

    const url = location.href.split('#')[0] + '#display';
    /* If the browser supports the Window Management API and a second screen
       is attached, place the display window straight onto it. */
    let feat = '', onSecond = false;
    try {
      if ('getScreenDetails' in window) {
        const sd = await window.getScreenDetails();  // one-time permission prompt
        const other = sd.screens.find(s => s !== sd.currentScreen);
        if (other) {
          feat = `left=${other.availLeft},top=${other.availTop},width=${other.availWidth},height=${other.availHeight}`;
          onSecond = true;
        }
      }
    } catch (e) { /* permission denied or unsupported — fall back to a plain window */ }
    const w = window.open(url, 'rpo8display', feat);
    if (!w) { toast('Pop-up blocked — allow pop-ups, or open this file again and add #display to the URL'); return; }
    toast(onSecond
      ? 'Display opened on your second screen — click “Go fullscreen” on it'
      : 'Display window opened — drag it to the projector screen, then press F for fullscreen');
  };
  $('#btnFsPrev').onclick = () => {
    const el = $('#previewWrap');

    else el.requestFullscreen().catch(() => toast('Fullscreen was blocked by the browser'));

  $('#btnSettings').onclick = openSettingsModal;
  $('#btnAddPerson').onclick = () => openPersonModal(null);
  $('#btnExport').onclick = exportJSON;
  $('#btnImport').onclick = () => $('#importFile').click();
  $('#importFile').onchange = importJSON;

  $('#ppCatFilter').onchange = (e) => { ui.catFilter = e.target.value; renderPeople(); };

  window.addEventListener('keydown', (e) => {
    if (/(INPUT|TEXTAREA|SELECT)/.test(document.activeElement.tagName)) return;
    if (state.live.scene !== 'spotlight') return;
    if (e.key === 'ArrowRight') stepSpotlight(1);
    if (e.key === 'ArrowLeft') stepSpotlight(-1);

  /* display heartbeat */
  if (bc) {
    bc.onmessage = (e) => {
      const d = e.data || {};
      if (d.type === 'display-online') ui.displayLastSeen = Date.now();
      if (d.type === 'state' && d.state) { /* another control window */ state = d.state; renderAll(false); }
    };
    setInterval(() => { try { bc.postMessage({ type: 'ping' }); } catch (e) {} }, 3000);
  }
  setInterval(() => {
    const on = Date.now() - ui.displayLastSeen < 8000;
    $('#dispDot').classList.toggle('on', on);
    $('#dispStat').textContent = on ? 'Display: connected' : 'Display: not detected';
  }, 1000);

  ui.sceneTab = state.live.scene;
  renderAll(false);
}

function renderAll(remount = true) {
  renderSceneTabs();
  renderSceneConfig();
  renderPeople();
  if (remount && preview) preview.mount(state.live, false);
  $('#liveName') && ($('#liveName').textContent = 'PREVIEW · LIVE: ' + sceneLabel(state.live.scene) + (state.live.blackout ? ' · BLACKOUT' : ''));

/* ── Scene tabs & per-scene config ────────────────────────────── */
const SCENE_TABS = [
  { id: 'title',     label: '① Title / Welcome' },
  { id: 'grid',      label: '② Panel Grid' },
  { id: 'spotlight', label: '③ Spotlight' },

function renderSceneTabs() {
  const host = $('#sceneTabs'); if (!host) return;
  host.innerHTML = SCENE_TABS.map(t =>
    `<button class="stab ${ui.sceneTab === t.id ? 'active' : ''} ${state.live.scene === t.id ? 'is-live' : ''}" data-tab="${t.id}">

    `<button class="stab blackout-btn ${state.live.blackout ? 'bo-on' : ''}" id="btnBlackout">
       ${state.live.blackout ? '● Blackout ON — click to restore' : '○ Blackout'}</button>`;

  $('#btnBlackout').onclick = () => {
    state.live.blackout = !state.live.blackout;
    persist();
    preview.setBlackout(state.live.blackout);

}

function catOptions(selected, withAll = true) {
  const cats = (withAll ? ['All'] : []).concat(allCategories());
  return cats.map(c => `<option value="${esc(c)}" ${c === selected ? 'selected' : ''}>${esc(c)}</option>`).join('');
}

function stepSpotlight(dir) {
  const queueCat = (state.live.scene === 'spotlight' && state.live.params.queue) || ui.spotQueue || 'All';
  const queue = peopleInCategory(queueCat);
  if (!queue.length) return;
  const curId = (state.live.scene === 'spotlight' && state.live.params.personId) || ui.spotId;
  let idx = queue.findIndex(p => p.id === curId);
  idx = (idx + dir + queue.length) % queue.length;
  ui.spotId = queue[idx].id; ui.spotQueue = queueCat;
  pushLive('spotlight', { personId: ui.spotId, queue: queueCat });
  if (ui.sceneTab === 'spotlight') renderSceneConfig();
}

/* ── People manager ───────────────────────────────────────────── */
function renderPeople() {
  const list = $('#ppList'); if (!list) return;
  const q = ui.q.trim().toLowerCase();
  const rows = state.people
    .map((p, idx) => ({ p, idx }))
    .filter(({ p }) => (ui.catFilter === 'All' || p.category === ui.catFilter))
    .filter(({ p }) => !q || [p.name, p.org, p.topic, p.category, p.session].join(' ').toLowerCase().includes(q));

  $('#ppCount').textContent = `${state.people.length} total`;
  const filt = $('#ppCatFilter');
  const keep = ui.catFilter;
  filt.innerHTML = catOptions(keep);

  if (!rows.length) {
    list.innerHTML = `<div class="pp-empty">${state.people.length ? 'No one matches your search.' : 'No people yet.<br>Click <b>＋ Add person</b> to enter your first speaker,<br>or load the sample line-up from Settings.'}</div>`;
    return;
  }
  list.innerHTML = rows.map(({ p, idx }) => `
    <div class="pp-row" data-id="${p.id}">
      ${photoCircleHTML(p)}
      <div class="pp-info">
        <div class="pp-name">${esc(fullName(p))}</div>
        <div class="pp-meta"><span class="chip ${catChipClass(p.category)}">${esc(p.category || '—')}</span>${esc(p.org || '')}${p.topic ? ' · ' + esc(p.topic) : ''}</div>
      </div>
      <div class="pp-actions">
        <button class="btn sm gold" data-act="spot" title="Push this person to the display now">Spotlight</button>
        <button class="icobtn" data-act="up" title="Move up">▲</button>
        <button class="icobtn" data-act="down" title="Move down">▼</button>
        <button class="icobtn" data-act="edit" title="Edit">✎</button>
        <button class="icobtn warn" data-act="del" title="Delete">✕</button>
      </div>
    </div>`).join('');

  $$('.pp-row', list).forEach(row => {
    const id = row.dataset.id;
    row.querySelectorAll('[data-act]').forEach(btn => btn.onclick = () => {
      const act = btn.dataset.act;
      const i = state.people.findIndex(x => x.id === id);
      if (act === 'edit') openPersonModal(personById(id));
      if (act === 'spot') { ui.spotId = id; ui.sceneTab = 'spotlight'; pushLive('spotlight', { personId: id, queue: ui.spotQueue || 'All' }); renderSceneTabs(); renderSceneConfig(); }
      if (act === 'del') {
        const p = personById(id);
        if (confirm(`Delete ${fullName(p)}? This cannot be undone.`)) {
          state.people.splice(i, 1); persist(); renderAll(); toast('Deleted');
        }
      }
      if (act === 'up' && i > 0) { [state.people[i - 1], state.people[i]] = [state.people[i], state.people[i - 1]]; persist(); renderPeople(); }
      if (act === 'down' && i < state.people.length - 1) { [state.people[i + 1], state.people[i]] = [state.people[i], state.people[i + 1]]; persist(); renderPeople(); }
    });
  });
}

/* ── Modals ───────────────────────────────────────────────────── */
function openModal(html) {
  closeModal();
  const veil = document.createElement('div');
  veil.className = 'modal-veil'; veil.id = 'modalVeil';
  veil.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(veil);
  veil.addEventListener('mousedown', (e) => { if (e.target === veil) closeModal(); });
  window.addEventListener('keydown', escClose);
  return veil;
}
function escClose(e) { if (e.key === 'Escape') closeModal(); }
function closeModal() { $('#modalVeil')?.remove(); window.removeEventListener('keydown', escClose); }

      <div class="frow">
        <div class="fld" style="width:130px"><label>Title / honorific</label>
          <input id="fHon" list="honList" value="${esc(p.honorific)}" placeholder="Dr"><datalist id="honList">${HONORIFICS.map(h => `<option value="${h}">`).join('')}</datalist></div>
        <div class="fld grow"><label>Full name *</label><input id="fName" value="${esc(p.name)}" placeholder="Chanda Mwale"></div>
      </div>
      <div class="frow"><div class="fld grow"><label>Organisation / affiliation</label><input id="fOrg" value="${esc(p.org)}" placeholder="University Teaching Hospitals, Lusaka"></div></div>
      <div class="frow"><div class="fld grow"><label>Topic / presentation title</label><input id="fTopic" value="${esc(p.topic)}" placeholder="Optimising Patient Dose in CT"></div></div>
      <div class="frow">
        <div class="fld grow"><label>Session</label><input id="fSession" value="${esc(p.session)}" placeholder="Session 2"></div>
        <div class="fld" style="width:150px"><label>Time slot</label><input id="fSlot" value="${esc(p.slot)}" placeholder="Tue 11:30"></div>
        <div class="fld" style="width:200px"><label>Category</label>
          <input id="fCat" list="catList" value="${esc(p.category)}"><datalist id="catList">${allCategories().map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>
      </div>
      <div class="frow"><div class="fld grow"><label>Bio (a paragraph)</label><textarea id="fBio" rows="5" placeholder="A short professional biography…">${esc(p.bio)}</textarea></div></div>
    </div>
    <div class="m-f">
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn gold big" id="mSave">${person ? 'Save changes' : 'Add person'}</button>
    </div>`);

  $('#mClose', veil).onclick = $('#mCancel', veil).onclick = closeModal;
  $('#btnPickPhoto', veil).onclick = () => $('#fPhoto', veil).click();
  $('#fPhoto', veil).onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      draftPhoto = await processImage(f, 640, 'image/jpeg', 0.85);
      $('#phPrev', veil).innerHTML = `<img class="ph" style="width:84px;height:84px" src="${draftPhoto}">`;
      toast('Photo attached');
    } catch (err) { toast('⚠ Could not read that image'); }
  };
  const rm = $('#btnRmPhoto', veil);
  if (rm) rm.onclick = () => { draftPhoto = null; $('#phPrev', veil).innerHTML = `<div class="ph" style="width:84px;height:84px"><span class="ph-init">${esc(initialsOf(p))}</span></div>`; };

  $('#mSave', veil).onclick = () => {
    const name = $('#fName', veil).value.trim();
    if (!name) { toast('⚠ A full name is required'); $('#fName', veil).focus(); return; }
    const data = {
      honorific: $('#fHon', veil).value.trim(),
      name,
      org: $('#fOrg', veil).value.trim(),
      topic: $('#fTopic', veil).value.trim(),
      session: $('#fSession', veil).value.trim(),
      slot: $('#fSlot', veil).value.trim(),
      category: $('#fCat', veil).value.trim() || 'Speaker',
      bio: $('#fBio', veil).value.trim(),
      photo: draftPhoto,
    };
    if (person) Object.assign(person, data);
    else state.people.push({ id: uid(), ...data });
    persist();
    closeModal();
    renderAll();
    toast(person ? 'Saved' : `${name} added`);
  };
}

function openSettingsModal() {
  const s = state.settings;
  const logoSlot = (kind, label, hint) => {
    const asset = kind === 'conf' ? state.assets.confLogo : state.assets.rpaLogo;
    return `<div class="logo-slot">
      <div class="lg-prev">${asset ? `<img src="${asset}">` : `<span>NO LOGO</span>`}</div>
      <div class="lg-info"><b>${label}</b><br>${hint}</div>
      <input type="file" id="f_${kind}" accept="image/png,image/webp,image/jpeg" hidden>
      <button class="btn sm" data-logo="${kind}">Upload</button>
      ${asset ? `<button class="btn sm danger" data-logoclear="${kind}">Remove</button>` : ''}
    </div>`;
  };
  const veil = openModal(`
    <div class="m-h"><h2>Settings</h2><button class="btn sm x" id="mClose">✕</button></div>
    <div class="m-b">
      <div class="settings-sec">Event wording (Title & holding scenes)</div>
      <div class="frow">
        <div class="fld grow"><label>Event name</label><input id="sName" value="${esc(s.eventName)}"></div>
        <div class="fld" style="width:200px"><label>Sub-line</label><input id="sSub" value="${esc(s.eventSub)}"></div>
      </div>
      <div class="frow"><div class="fld grow"><label>Theme</label><input id="sTheme" value="${esc(s.theme)}"></div></div>
      <div class="frow">
        <div class="fld grow"><label>Dates line</label><input id="sDates" value="${esc(s.datesText)}"></div>
        <div class="fld grow"><label>Venue line</label><input id="sVenue" value="${esc(s.venueText)}"></div>
      </div>
      <div class="frow"><div class="fld grow"><label>Host line</label><input id="sHost" value="${esc(s.hostText)}"></div></div>
      <div class="frow">
        <div class="fld grow"><label>Hashtag footer</label><input id="sTags" value="${esc(s.hashtags)}"></div>
        <div class="fld" style="width:140px"><label>Show hashtags</label><select id="sTagsOn"><option value="1" ${s.showHashtags ? 'selected' : ''}>Yes</option><option value="0" ${!s.showHashtags ? 'selected' : ''}>No</option></select></div>
      </div>

      <div class="settings-sec">Conference stats (Countdown scene)</div>
      <div class="frow">
        <div class="fld"><label>Start date</label><input type="date" id="sStart" value="${esc(s.startDate)}"></div>
        <div class="fld" style="width:110px"><label>Total days</label><input type="number" id="sDays" min="1" max="14" value="${esc(s.totalDays)}"></div>
        <div class="fld" style="width:130px"><label>“Day X” shows</label><select id="sDayOv">
          <option value="auto" ${s.dayOverride === 'auto' ? 'selected' : ''}>Auto (by date)</option>
          ${[1,2,3,4,5,6,7].slice(0, s.totalDays || 4).map(d => `<option value="${d}" ${String(s.dayOverride) === String(d) ? 'selected' : ''}>Day ${d}</option>`).join('')}
        </select></div>
        <div class="fld" style="width:160px"><label>Sessions (blank = auto)</label><input type="number" id="sSess" min="0" value="${esc(s.sessionsOverride)}" placeholder="auto: ${sessionsCount()}"></div>
      </div>

      <div class="settings-sec">Logos</div>
      ${logoSlot('conf', 'Conference logo', 'Use <b>conf_logo_transparent.png</b> — the transparent version for dark scenes. Also auto-loads from <code>logos/</code> beside this file.')}
      ${logoSlot('rpa', 'RPA logo', 'Institutional mark, shown on the Title scene host line. Auto-loads from <code>logos/rpa_logo.png</code>.')}

      <div class="settings-sec">Data</div>
      <div class="push-row">
        <button class="btn" id="sSample">Load sample line-up</button>
        <button class="btn danger" id="sWipe">Clear ALL data…</button>
      </div>
    </div>
    <div class="m-f">
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn gold big" id="mSave">Save settings</button>
    </div>`);

  $('#mClose', veil).onclick = $('#mCancel', veil).onclick = closeModal;
  $$('[data-logo]', veil).forEach(b => b.onclick = () => $('#f_' + b.dataset.logo, veil).click());
  $$('[data-logoclear]', veil).forEach(b => b.onclick = () => {
    if (b.dataset.logoclear === 'conf') state.assets.confLogo = null; else state.assets.rpaLogo = null;
    persist(); closeModal(); openSettingsModal(); renderAll();
  });
  ['conf', 'rpa'].forEach(kind => {
    const inp = $('#f_' + kind, veil); if (!inp) return;
    inp.onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const data = await processImage(f, 560, 'image/png');
        if (kind === 'conf') state.assets.confLogo = data; else state.assets.rpaLogo = data;
        persist(); closeModal(); openSettingsModal(); renderAll(); initControlHeaderMark();
        toast('Logo saved');
      } catch (err) { toast('⚠ Could not read that image'); }
    };
  });
  $('#sSample', veil).onclick = () => {
    state.people = state.people.concat(SAMPLE_PEOPLE.map(p => ({ id: uid(), photo: null, ...p })));
    persist(); closeModal(); renderAll(); toast('Sample line-up added');
  };
  $('#sWipe', veil).onclick = () => {
    if (confirm('Really clear ALL people, settings and logos? Export a JSON backup first if unsure.')) {
      state = defaultState(false); persist(); closeModal(); renderAll(); toast('All data cleared');
    }
  };
  $('#mSave', veil).onclick = () => {
    Object.assign(state.settings, {
      eventName: $('#sName', veil).value.trim(),
      eventSub: $('#sSub', veil).value.trim(),
      theme: $('#sTheme', veil).value.trim(),
      datesText: $('#sDates', veil).value.trim(),
      venueText: $('#sVenue', veil).value.trim(),
      hostText: $('#sHost', veil).value.trim(),
      hashtags: $('#sTags', veil).value.trim(),
      showHashtags: $('#sTagsOn', veil).value === '1',
      startDate: $('#sStart', veil).value,
      totalDays: +$('#sDays', veil).value || 4,
      dayOverride: $('#sDayOv', veil).value,
      sessionsOverride: $('#sSess', veil).value,
    });
    persist(); closeModal(); renderAll(); toast('Settings saved');
  };
}
function initControlHeaderMark() {
  const mark = $('.hd-mark'); if (!mark) return;
  mark.innerHTML = state.assets.confLogo ? `<img src="${state.assets.confLogo}" alt="">` : `<span>8</span>`;
}

/* ── Export / Import ──────────────────────────────────────────── */
function exportJSON() {
  const out = { app: 'rpo8-conference-display', version: 1, exportedAt: new Date().toISOString(),
    settings: state.settings, assets: state.assets, people: state.people };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `rpo8-conference-data-${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(`Exported ${state.people.length} people + settings`);
}
function importJSON(e) {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (!d || !Array.isArray(d.people)) throw new Error('bad shape');
      if (!confirm(`Import ${d.people.length} people${d.settings ? ' + settings' : ''}? This replaces the current data.`)) return;
      state.people = d.people.map(p => ({ id: p.id || uid(), honorific: '', org: '', topic: '', session: '', slot: '', category: 'Speaker', bio: '', photo: null, ...p }));
      if (d.settings) state.settings = Object.assign(defaultState(false).settings, d.settings);
      if (d.assets) state.assets = Object.assign({ confLogo: null, rpaLogo: null }, d.assets);
      persist(); renderAll(); initControlHeaderMark();
      toast(`Imported ${state.people.length} people`);
    } catch (err) { toast('⚠ That file is not a valid conference-data JSON export'); }
  };
  fr.readAsText(f);
}

/* ════════════════════════════════════════════════════════════════
   7. BOOT
   ════════════════════════════════════════════════════════════════ */
loadState();
if (IS_DISPLAY) initDisplay(); else initControl();
</script>
